<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Red &amp; Gold Golf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{--red:#B3122B;--red-d:#7A0C1D;--red-dd:#45060F;--gold:#F2C14E;--gold-l:#FFE08A;--gold-d:#C9962B;--cream:#FFF7E3}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--red-dd);font-family:Inter,system-ui,-apple-system,sans-serif;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #gl,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
  #fx{pointer-events:none}
  .hidden{display:none !important}
  button{font-family:inherit}

  /* ---------- In-game HUD ---------- */
  .top{position:fixed;top:0;left:0;right:0;display:flex;gap:4px;padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;
       background:linear-gradient(180deg,rgba(69,6,15,.96),rgba(122,12,29,.88));border-bottom:2px solid var(--gold);pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.35)}
  .stat{flex:1;text-align:center;min-width:0}
  .stat .l{font:800 10px/1 Inter,sans-serif;letter-spacing:.14em;color:var(--gold)}
  .stat .v{font:700 22px/1.2 Oswald,sans-serif;margin-top:3px;white-space:nowrap}
  #windV{display:flex;align-items:center;justify-content:center;gap:3px;font-size:17px}
  #windArrow{width:20px;height:20px;transition:transform .25s ease-out}
  .bottom{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);
          background:linear-gradient(0deg,rgba(69,6,15,.96),rgba(122,12,29,.85));border-top:2px solid var(--gold);box-shadow:0 -4px 18px rgba(0,0,0,.35)}
  .cbtn{width:46px;height:46px;flex:none;border-radius:50%;border:2px solid var(--gold);background:var(--red-dd);color:var(--gold);
        font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .cbtn:active{transform:scale(.94)}
  .club{flex:1;text-align:center;min-width:0;cursor:pointer;border-radius:14px;padding:5px 6px 6px;border:2px solid var(--gold);background:linear-gradient(180deg,#9b1228,#5c0815);box-shadow:0 3px 0 #8a6416}
  .club .chg{display:inline-block;font:800 10px Inter,sans-serif;letter-spacing:.14em;color:var(--red-dd);background:var(--gold);border-radius:999px;padding:2px 9px;margin-bottom:3px}
  .club:active{transform:translateY(2px);box-shadow:0 1px 0 #8a6416}
  .club .n{font:700 21px/1.1 Oswald,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--gold-l)}
  .club .n small{font-size:14px;color:#fff;margin-left:6px;letter-spacing:0}
  .club .i{font-size:12px;color:#f6dcb0;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{position:fixed;top:calc(env(safe-area-inset-top) + 78px);height:36px;padding:0 14px;border-radius:999px;border:2px solid var(--gold);
        background:var(--red-dd);color:var(--gold);font:800 12px Inter,sans-serif;letter-spacing:.08em;cursor:pointer}
  #viewBtn{right:10px} #exitBtn{left:10px}
  #pinBox{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 78px);background:rgba(69,6,15,.85);border:1px solid var(--gold);
          border-radius:999px;padding:6px 14px;font:700 15px Oswald,sans-serif;letter-spacing:.04em;pointer-events:none;white-space:nowrap}
  #pinBox b{color:var(--gold-l)}
  .disabled{opacity:.4;pointer-events:none}

  #banner{position:fixed;left:0;right:0;top:30%;text-align:center;pointer-events:none;opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s}
  #banner.show{opacity:1;transform:scale(1)}
  #banner .t{font:700 46px/1 Oswald,sans-serif;color:var(--gold-l);letter-spacing:.03em;text-transform:uppercase;text-shadow:0 3px 0 var(--red-d),0 6px 18px rgba(0,0,0,.55)}
  #banner .s{display:inline-block;margin-top:10px;font:700 14px Inter,sans-serif;background:rgba(69,6,15,.85);border:1px solid var(--gold);padding:6px 14px;border-radius:999px}
  #banner .s:empty{display:none}
  #rating{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 128px);text-align:center;pointer-events:none;
          font:700 30px Oswald,sans-serif;letter-spacing:.06em;opacity:0;transition:opacity .2s;text-shadow:0 2px 0 var(--red-d),0 4px 12px rgba(0,0,0,.5)}
  #rating.show{opacity:1}

  /* club picker sheet */
  #sheet{position:fixed;inset:0;z-index:8;background:rgba(20,2,6,.55);display:flex;align-items:flex-end}
  #sheet .panel{width:100%;background:linear-gradient(180deg,#8E0F22,#4F0712);border-top:2px solid var(--gold);border-radius:20px 20px 0 0;
                padding:16px 12px calc(env(safe-area-inset-bottom) + 16px)}
  #sheet h3{margin:0 0 4px;text-align:center;font:700 20px Oswald,sans-serif;color:var(--gold-l);letter-spacing:.06em}
  #sheet .hint{text-align:center;font-size:12px;color:#f3d7a8;margin-bottom:12px}
  .bag{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:520px;margin:0 auto}
  .bag button{background:var(--red-dd);border:2px solid rgba(242,193,78,.45);border-radius:14px;color:#fff;padding:10px 4px;cursor:pointer}
  .bag button.on{border-color:var(--gold-l);background:#6d0a1a;box-shadow:0 0 0 2px rgba(255,224,138,.25)}
  .bag button.rec{position:relative}
  .bag button.rec::after{content:'BEST';position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--red-dd);font:800 9px Inter;padding:2px 6px;border-radius:999px;letter-spacing:.08em}
  .bag .bn{font:700 14px Oswald,sans-serif;color:var(--gold-l);text-transform:uppercase;line-height:1.1}
  .bag .by{font:700 20px Oswald,sans-serif;margin-top:4px}
  .bag .by small{font-size:11px;color:#f3d7a8;margin-left:2px}

  /* ---------- Home screen ---------- */
  .screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
          background:linear-gradient(180deg,rgba(45,4,10,.55) 0%,rgba(45,4,10,.82) 35%,rgba(35,3,8,.96) 100%)}
  .hhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 16px 12px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .crest{width:46px;height:46px;flex:none;border-radius:50%;border:3px solid var(--gold);background:var(--red);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .bname{font:700 24px/1 Oswald,sans-serif;color:var(--gold-l);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{font:800 10px Inter,sans-serif;letter-spacing:.22em;color:var(--gold);margin-top:4px}
  .coins{flex:none;background:var(--red-dd);border:1px solid var(--gold);color:var(--gold-l);font:700 18px Oswald,sans-serif;padding:6px 14px;border-radius:999px}
  .hbody{flex:1;overflow-y:auto;padding:4px 16px 20px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
  .wrap{max-width:560px;margin:0 auto}
  .sect{font:700 13px Inter,sans-serif;letter-spacing:.18em;color:var(--gold);margin:14px 2px 10px}
  .tabs{display:flex;background:linear-gradient(0deg,#3a050d,#5c0815);border-top:2px solid var(--gold);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
  .tabs button{flex:1;background:none;border:0;color:#d9b98a;padding:6px 0;cursor:pointer;border-radius:12px;font:700 11px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase}
  .tabs button .ic{display:block;font-size:20px;margin-bottom:3px}
  .tabs button.on{color:var(--gold-l);background:rgba(242,193,78,.12)}

  .course{display:flex;gap:12px;align-items:stretch;background:linear-gradient(180deg,rgba(142,15,34,.9),rgba(79,7,18,.95));border:2px solid rgba(242,193,78,.55);
          border-radius:18px;padding:10px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .course.sel{border-color:var(--gold-l)}
  .course .thumb{width:84px;flex:none;border-radius:12px;background:#2f6f30 center/cover no-repeat;border:1px solid rgba(255,255,255,.2);min-height:110px}
  .course .ci{flex:1;min-width:0;display:flex;flex-direction:column}
  .course .cn{font:700 21px/1.1 Oswald,sans-serif;color:var(--gold-l);text-transform:uppercase;letter-spacing:.03em}
  .course .cd{font-size:13px;color:#f3d7a8;margin:4px 0 6px;line-height:1.35}
  .course .cm{font-size:12px;color:#fff;opacity:.85}
  .course .act{margin-top:auto;padding-top:8px}
  .lock{font-size:12px;color:#f3d7a8;background:rgba(0,0,0,.25);border-radius:10px;padding:8px 10px}

  button.main{background:linear-gradient(180deg,var(--gold-l),var(--gold-d));color:var(--red-dd);border:0;border-radius:999px;padding:12px 26px;
              font:700 17px Oswald,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 0 #8a6416}
  button.main:active{transform:translateY(2px);box-shadow:0 2px 0 #8a6416}
  button.main.sm{padding:8px 16px;font-size:15px;box-shadow:0 3px 0 #8a6416}
  button.ghost{background:transparent;color:var(--gold-l);border:2px solid var(--gold);border-radius:999px;padding:11px 26px;
               font:700 16px Oswald,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  button:disabled{opacity:.45;cursor:default;box-shadow:none}

  .clubcard{display:flex;align-items:center;gap:12px;background:rgba(79,7,18,.85);border:1px solid rgba(242,193,78,.35);border-radius:14px;padding:10px 12px;margin-bottom:8px}
  .clubcard .yd{width:64px;flex:none;text-align:center;font:700 26px/1 Oswald,sans-serif;color:var(--gold-l)}
  .clubcard .yd small{display:block;font:800 9px Inter;letter-spacing:.14em;color:var(--gold);margin-top:4px}
  .clubcard .info{flex:1;min-width:0}
  .clubcard .name{font:700 17px Oswald,sans-serif;text-transform:uppercase;letter-spacing:.03em}
  .clubcard .stats{font-size:12px;color:#f3d7a8;margin-top:2px}
  .pips{display:flex;gap:3px;margin-top:6px}
  .pip{width:16px;height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
  .pip.on{background:var(--gold)}

  .back{background:none;border:0;color:var(--gold-l);font:700 14px Inter,sans-serif;padding:10px 2px 2px;cursor:pointer}
  .slot{background:rgba(79,7,18,.88);border:1px solid rgba(242,193,78,.4);border-radius:16px;padding:12px;margin-bottom:12px}
  .slothead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
  .slothead span{font:800 10px Inter;letter-spacing:.16em;color:var(--gold)}
  .slothead b{font:700 19px Oswald,sans-serif;color:var(--gold-l);text-transform:uppercase;letter-spacing:.03em;text-align:right}
  .sbar{display:grid;grid-template-columns:70px 1fr 96px;align-items:center;gap:8px;font-size:12px;margin:4px 0}
  .sbar span{color:#f3d7a8;font-weight:600}
  .sbar i{display:block;height:7px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
  .sbar i b{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold-d),var(--gold-l))}
  .sbar em{font-style:normal;color:#fff;opacity:.85;text-align:right;white-space:nowrap}
  .uprow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0 4px}
  .nx{font-size:11px;color:#f3d7a8;margin-top:5px}
  .models{border-top:1px solid rgba(242,193,78,.2);margin-top:10px;padding-top:4px}
  .model{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(242,193,78,.12)}
  .model:last-child{border-bottom:0}
  .model .mi{flex:1;min-width:0}
  .model .mn{font:700 15px Oswald,sans-serif;letter-spacing:.02em}
  .model .mn small{font:600 11px Inter;color:var(--gold-l);margin-left:4px}
  .model .md{font-size:11.5px;color:#f3d7a8;line-height:1.35;margin-top:2px}
  .model.on .mn{color:var(--gold-l)}
  .tagon{font:800 10px Inter;letter-spacing:.1em;color:var(--red-dd);background:var(--gold);border-radius:999px;padding:4px 9px;white-space:nowrap}
  button.ghost.sm{padding:6px 14px;font-size:14px}
  .gstage{position:relative;height:300px;border-radius:18px;overflow:hidden;border:2px solid rgba(242,193,78,.55);
          background:radial-gradient(ellipse at 50% 85%,#4f9d48 0%,#2f6f30 45%,#3f8fd6 46%,#b9dcf3 100%)}
  #gPrev{width:100%;height:100%;display:block}
  .nameRow{display:block;font:800 10px Inter;letter-spacing:.16em;color:var(--gold);margin:14px 2px 0;text-transform:uppercase}
  .nameRow input{display:block;width:100%;margin-top:6px;padding:11px 14px;border-radius:12px;border:2px solid rgba(242,193,78,.55);background:var(--red-dd);
                 color:#fff;font:700 18px Oswald,sans-serif;letter-spacing:.03em;-webkit-user-select:text;user-select:text;touch-action:auto}
  .presets{display:flex;flex-wrap:wrap;gap:8px}
  .presets button{border:2px solid rgba(242,193,78,.5);background:var(--red-dd);color:#fff;border-radius:999px;padding:7px 12px 7px 8px;font:700 13px Inter,sans-serif;
                  display:flex;align-items:center;gap:7px;cursor:pointer}
  .presets button i{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.6)}
  .lookrow{margin-top:14px}
  .lookrow .lh{font:800 10px Inter;letter-spacing:.16em;color:var(--gold);margin:0 2px 7px;text-transform:uppercase;display:flex;justify-content:space-between}
  .lookrow .lh b{color:#fff;letter-spacing:.04em;font-weight:600}
  .sw{display:flex;flex-wrap:wrap;gap:8px}
  .sw button{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.35);cursor:pointer;padding:0}
  .sw button.on{border:3px solid var(--gold-l);box-shadow:0 0 0 3px rgba(255,224,138,.35)}
  .hero{height:150px;border-radius:18px;background:#2f6f30 center/cover no-repeat;border:2px solid rgba(242,193,78,.55);margin-top:8px}
  .cdname{font:700 34px/1.05 Oswald,sans-serif;color:var(--gold-l);text-transform:uppercase;letter-spacing:.03em;margin-top:6px}
  .cddesc{font-size:14px;color:#f3d7a8;margin:4px 0 10px;line-height:1.4}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips span{background:rgba(69,6,15,.85);border:1px solid rgba(242,193,78,.45);border-radius:999px;padding:5px 11px;font:700 12px Inter}
  .chips b{color:var(--gold-l)}
  .cdbtns{display:flex;gap:10px;margin:14px 0 4px}
  .cdbtns button{flex:1}
  .board{width:100%;border-collapse:collapse;font-size:14px;background:rgba(79,7,18,.85);border:1px solid rgba(242,193,78,.35);border-radius:14px;overflow:hidden;margin:0}
  .board td,.board th{padding:8px 10px;text-align:left}
  .board td:last-child,.board th:last-child{text-align:right}
  .board tr.me td{color:var(--gold-l)}
  .board .rk{width:34px;font:700 16px Oswald,sans-serif;color:var(--gold)}
  .empty{background:rgba(79,7,18,.85);border:1px dashed rgba(242,193,78,.4);border-radius:14px;padding:14px;font-size:13px;color:#f3d7a8;text-align:center}
  .holes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .holes .hm{display:block;height:84px;border-radius:7px;background:#2f6f30 center/contain no-repeat;margin:0 4px 6px}
  @media (max-width:420px){.holes{grid-template-columns:repeat(3,1fr)}}
  .holes div{background:rgba(79,7,18,.85);border:1px solid rgba(242,193,78,.3);border-radius:10px;padding:7px 2px;text-align:center;font-size:11px;color:#f3d7a8}
  .holes b{display:block;font:700 16px Oswald,sans-serif;color:var(--gold-l)}
  .howcard{background:rgba(79,7,18,.85);border:1px solid rgba(242,193,78,.35);border-radius:14px;padding:4px 16px;font-size:14px;line-height:1.5;color:var(--cream)}
  .howcard p{margin:10px 0}
  .howcard b{color:var(--gold-l)}
  .needle{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:10px 0 4px}
  .needle i{flex:1}
  .nlabels{display:flex;justify-content:space-between;font:800 10px Inter;letter-spacing:.06em;color:#f3d7a8;margin-bottom:10px}
  .cg{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0 10px}
  .cg td,.cg th{padding:6px 4px;border-bottom:1px solid rgba(242,193,78,.2);text-align:left}
  .cg th{font-size:10px}
  .tabs button{font-size:10px}
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .tile{background:rgba(79,7,18,.85);border:1px solid rgba(242,193,78,.35);border-radius:14px;padding:12px}
  .tile .v{font:700 28px/1 Oswald,sans-serif;color:var(--gold-l)}
  .tile .l{font:800 10px Inter;letter-spacing:.14em;color:#f3d7a8;margin-top:6px;text-transform:uppercase}
  .rows{background:rgba(79,7,18,.85);border:1px solid rgba(242,193,78,.35);border-radius:14px;padding:4px 12px}
  .rows div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(242,193,78,.18);font-size:14px}
  .rows div:last-child{border-bottom:0}
  .rows b{color:var(--gold-l)}
  .howlist{background:rgba(79,7,18,.85);border:1px solid rgba(242,193,78,.35);border-radius:14px;padding:6px 16px 6px 34px;margin:0;font-size:14px;line-height:1.55;color:var(--cream)}
  .howlist li{margin:8px 0}
  .howlist b{color:var(--gold-l)}
  .reset{margin:20px auto 0;display:block;background:none;border:0;color:#c79a7a;font-size:12px;text-decoration:underline;cursor:pointer}

  /* end-of-round card */
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:12;background:radial-gradient(ellipse at top,rgba(122,12,29,.6),rgba(30,3,8,.88))}
  .card{background:linear-gradient(180deg,#8E0F22,#4F0712);border:2px solid var(--gold);border-radius:20px;padding:24px 22px;
        width:calc(100% - 40px);max-width:380px;max-height:calc(100vh - 40px);overflow:auto;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .card h2{margin:0 0 4px;font:700 28px/1.1 Oswald,sans-serif;color:var(--gold-l);text-transform:uppercase;letter-spacing:.03em}
  .card .sub{font-size:13px;color:#f3d7a8;margin-bottom:6px}
  table{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:15px;color:var(--cream)}
  th,td{padding:6px 4px;border-bottom:1px solid rgba(242,193,78,.25)}
  th{color:var(--gold);font-weight:600;font-size:12px;letter-spacing:.08em}
  .under{color:var(--gold-l);font-weight:800}
  .total td{font-weight:800;border-bottom:0}
  .earn{font-size:15px;color:var(--cream);text-align:left;margin:0 0 14px}
  .earn div{display:flex;justify-content:space-between;padding:2px 0}
  .earn .sum{font-weight:800;border-top:1px solid rgba(242,193,78,.4);margin-top:4px;padding-top:6px}
  .earn .sum span:last-child{color:var(--gold-l)}
  .best{font-size:13px;color:#f3d7a8;margin:0 0 16px}
  .btns{display:flex;flex-direction:column;gap:10px}
  #err{color:var(--gold-l);font-size:14px;margin:12px 0;background:rgba(0,0,0,.3);padding:12px;border-radius:12px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>

<!-- ===== In-game HUD ===== -->
<div class="top" id="hud">
  <div class="stat"><div class="l">HOLE</div><div class="v" id="hHole">1/6</div></div>
  <div class="stat"><div class="l">PAR</div><div class="v" id="hPar">4</div></div>
  <div class="stat"><div class="l">STROKE</div><div class="v" id="hStroke">0</div></div>
  <div class="stat"><div class="l">TOTAL</div><div class="v" id="hTotal">E</div></div>
  <div class="stat"><div class="l">WIND MPH</div>
    <div class="v" id="windV">
      <svg id="windArrow" viewBox="0 0 24 24"><path d="M12 2 L19 12 H14 V22 H10 V12 H5 Z" fill="#FFE08A"/></svg>
      <span id="windTxt">0</span>
    </div>
  </div>
</div>
<button class="pill" id="exitBtn">✕ QUIT</button>
<div id="pinBox">PIN <b id="pinYds">0</b> YDS</div>
<button class="pill" id="viewBtn">MAP</button>

<div class="bottom" id="bar">
  <button class="cbtn" id="prevClub" aria-label="Previous club">◀</button>

    else if (aoe < 0.35) showRating(oe > 0 ? 'GOOD · FADE' : 'GOOD · DRAW', '#F2C14E');

    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.04, 14, 10), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 }));
    turn.add(ball);
    const pad = new THREE.Mesh(new THREE.CircleGeometry(1.5, 40), new THREE.MeshLambertMaterial({ color: 0x5fb556 }));

  function renderPreview(time) {
    const P = golferPreview(), cv = $('gPrev'), w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) return;
    if (P.w !== w || P.h !== h) { P.r.setSize(w, h, false); P.cam.aspect = w / h; P.cam.updateProjectionMatrix(); P.w = w; P.h = h; }
    const kind = clubKind(CLUBS[0]), B = P.g.B[kind];
    P.g.root.position.set(0, 0, -B / 2); P.ball.position.set(0, 0.04, B / 2);
    P.turn.rotation.y = time * 0.35;
    // a slow demo swing on a loop
    const T = time % 4, p = 1;
    let pose = { a: 0, h: 0, t: 0 };
    if (T > 1 && T < 2.2) pose = lerpPose(pose, backPose(false, p), easeOut((T - 1) / 1.2));
    else if (T >= 2.2 && T < 2.36) pose = lerpPose(backPose(false, p), IMPACT, easeIn((T - 2.2) / 0.16));
    else if (T >= 2.36) pose = lerpPose(IMPACT, finishPose(false, p), easeOut(clamp((T - 2.36) / 0.45, 0, 1)));
    poseGolfer(P.g, kind, pose.a, pose.h, pose.t);
    P.cam.position.set(0, 1.25, 4.6); P.cam.lookAt(0, 0.85, 0);
    P.r.render(P.sc, P.cam);
  }

    });
    rows += `<tr class="total"><td>Total</td><td>${tp}</td><td${rel < 0 ? ' class="under"' : ''}>${ts}</td><td>${fmtRel(rel)}</td></tr>`;
    $('scoreTable').innerHTML = rows;
    $('finalCourse').textContent = course.name;
    $('finalTitle').textContent = rel <= -2 ? 'Tour pro! 🏆' : rel <= 2 ? 'Great round!' : rel <= 8 ? 'Nice round' : 'Keep grinding';

    const holeMoney = earned.reduce((a, b) => a + (b || 0), 0);
    const underBonus = rel < 0 ? -rel * UNDER_PAR_BONUS : 0;
    const total = holeMoney + ROUND_BONUS + underBonus;
    let lines = `<div><span>Hole payouts</span><span>${money(holeMoney)}</span></div><div><span>Round bonus</span><span>${money(ROUND_BONUS)}</span></div>`;
    if (underBonus) lines += `<div><span>Under-par bonus</span><span>${money(underBonus)}</span></div>`;
    lines += `<div class="sum"><span>Earned</span><span>+${money(total)}</span></div>`;
    $('earnBox').innerHTML = lines;

    const wasLocked = COURSES.filter(c => !isUnlocked(c)).map(c => c.id);
    save.coins += total; s.earnedTotal += total; s.rounds++; s.strokesTotal += ts; s.parTotal += tp;
    s.roundsBy[course.id] = (s.roundsBy[course.id] || 0) + 1;
    let line;
    const best = s.bestBy[course.id];
    if (best == null || rel < best) { line = best == null ? 'First round here!' : 'New course best!'; s.bestBy[course.id] = rel; }
    else line = `Course best: ${fmtRel(best)}`;
    const rank = recordScore(rel, ts);
    if (rank) line += ` · Leaderboard #${rank}`;
    const newly = COURSES.filter(c => wasLocked.includes(c.id) && isUnlocked(c));
    if (newly.length) line += ` · 🔓 ${newly.map(c => c.name).join(', ')} unlocked!`;
    persist();
    $('bestLine').textContent = `${line} · Bank: ${money(save.coins)}`;
    $('final').classList.remove('hidden');
  }

  $('againBtn').addEventListener('click', () => startRound(course));
  $('homeBtn').addEventListener('click', () => { showHome(); setTab('course'); });

  showHome();

  // ================= Loop =================
  let last = performance.now(), acc = 0;
  const STEP = 1 / 120;
  // On the home screen the 3D course is just a backdrop: draw it at lower resolution,
  // ~30 fps and with frozen shadows so menus and scrolling stay smooth.
  let lite = null, lastDraw = 0;
  function setLite(on) {
    if (lite === on) return; lite = on;
    const d = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(on ? Math.min(d, 1) * 0.75 : d);
    renderer.shadowMap.autoUpdate = !on; renderer.shadowMap.needsUpdate = true;
    resize();
  }
  document.addEventListener('visibilitychange', () => { last = performance.now(); });
  function loop(now) {
    requestAnimationFrame(loop);
    const onHome = state === 'title' && !$('home').classList.contains('hidden');
    setLite(onHome);
    if (onHome && now - lastDraw < 32) return;
    if (onHome && tab === 'golfer') renderPreview(now / 1000);
    lastDraw = now;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    acc += dt;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
    if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').classList.remove('show'); }
    if (ratingT > 0) { ratingT -= dt; if (ratingT <= 0) $('rating').classList.remove('show'); }
    syncScene(now / 1000, dt);
    renderer.render(scene, camera);
    drawFx(now / 1000);
    updateHud();
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
